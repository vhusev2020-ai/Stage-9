name: Build VEbalist APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Lint and build APK
        env:
          VEBALIST_BACKEND_URL: ${{ vars.VEBALIST_BACKEND_URL }}
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VEbalist-v2.0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VEbalist-v2.0.1-debug
          path: VEbalist-v2.0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
